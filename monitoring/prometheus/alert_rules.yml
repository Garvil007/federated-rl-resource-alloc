groups:
  - name: federated_rl_alerts
    rules:
      # Training alerts
      - alert: RewardDegradation
        expr: fed_global_reward < -10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Global reward dropped below -10"
          description: "Federated model performance is degrading. Current reward: {{ $value }}"

      - alert: ClientDivergence
        expr: fed_weight_divergence > 5.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High client weight divergence detected"
          description: "Client drift is {{ $value }}. Consider switching to FedProx or increasing local epochs."

      - alert: TrainingStalled
        expr: rate(fed_rounds_total[10m]) == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Federation training has stalled"
          description: "No rounds completed in the last 10 minutes."

      - alert: LowSLACompliance
        expr: fed_sla_compliance_rate < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SLA compliance rate below 50%"

      # Serving alerts
      - alert: HighPredictionLatency
        expr: histogram_quantile(0.99, rate(prediction_latency_seconds_bucket[5m])) > 1.0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "P99 prediction latency exceeds 1 second"

      - alert: HighErrorRate
        expr: rate(prediction_errors_total[5m]) / rate(predictions_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prediction error rate exceeds 5%"

      - alert: ModelServerDown
        expr: up{job="model-serving"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Model serving endpoint is down"
