name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

env:
  PYTHON_VERSION: "3.11"
  WANDB_MODE: "disabled"   # Don't log to W&B during CI

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Type check
        run: mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  env-validation:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Validate Gym environment
        run: |
          python -c "
          import gymnasium as gym
          from gymnasium.utils.env_checker import check_env
          import src.envs  # triggers registration
          env = gym.make('ResourceAllocation-v0')
          check_env(env.unwrapped, skip_render_check=True)
          print('Environment validation PASSED')
          "

      - name: Smoke test training
        run: |
          python -c "
          import ray
          from src.agents.ppo_agent import build_ppo_config
          ray.init(num_cpus=2)
          cfg = build_ppo_config(
              {'num_nodes': 3, 'max_pending_tasks': 5, 'episode_length': 50},
              {'lr': 3e-4, 'workers': 0, 'gpus': 0, 'batch_size': 200,
               'minibatch': 100, 'num_sgd_iter': 2}
          )
          algo = cfg.build_algo()
          result = algo.train()
          reward = result.get('env_runners', result).get('episode_reward_mean', 'N/A')
          print(f'Smoke test reward: {reward}')
          algo.stop()
          ray.shutdown()
          print('Training smoke test PASSED')
          "
