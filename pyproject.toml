[project]
name = "federated-rl-resource-alloc"
version = "0.1.0"
requires-python = ">=3.9,<3.12"
dependencies = [
    "gymnasium>=0.29.0",
    "ray[rllib]>=2.9.0",
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "wandb>=0.16.0",
    "mlflow>=2.10.0",
    "prometheus-client>=0.19.0",
    "hydra-core>=1.3.0",
    "grpcio>=1.60.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy", "pre-commit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
